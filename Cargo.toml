[package]
name = "rhesis"
version = "0.6.0"
authors = ["dimkar <dimkar3000@gmail.com>"]
edition = "2021"
license = "MIT"

# Every test target is declared explicitly below; auto-discovery would also
# compile shared helpers (tests/common.rs) as empty test targets.
autotests = false

default-run = "rhesis"

[dependencies]
env_logger = "0.11.11"
log = { workspace = true }

rhesis-qt-client = { path = "crates/rhesis-qt-client" }
rhesis-constants = { path = "crates/rhesis-constants" }
rhesis-languagetool = { path = "crates/rhesis-languagetool" }
rhesis-service = { path = "crates/rhesis-service" }

[workspace]
members = [
    "crates/rhesis-constants",
    "crates/rhesis-platform",
    "crates/rhesis-languagetool",
    "crates/rhesis-protocol",
    "crates/rhesis-settings",
    "crates/rhesis-service",
    "crates/rhesis-qt-client",
]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
log = "0.4.33"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full", "sync"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[[bin]]
name = "rhesis"
path = "src/rhesis-qt-client.rs"

[[bin]]
name = "rhesis-service"
path = "src/rhesis-server.rs"

[[bin]]
name = "rhesis-ui-runner"
path = "src/rhesis-ui-runner.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
# Version info and icon for the Windows executable; the Windows shell (Task
# manager's Startup list, Explorer, the taskbar) reads these from the exe.
winresource = "0.1"

# The boot E2E drives the real Qt boot and spawns the shipped client binary
# (CARGO_BIN_EXE_rhesis), so it lives here rather than in the qt-client
# crate. Both targets are declared explicitly (autotests is off), and
# dev-only Qt deps stay out of the shipped binaries' linkage.

[[test]]
name = "ui-boot"
path = "tests/e2e/ui_boot.rs"

# QML page suites (crates/rhesis-qt-client/tests/ui) via the Qt Quick Test runner
# binary, which lives in this package.
[[test]]
name = "qml-suites"
path = "tests/e2e/qml_suites.rs"

[dev-dependencies]
cxx = "1.0.176"
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"] }
cxx-qt-lib-extras = { version = "0.9.1" }

rhesis-platform = { path = "crates/rhesis-platform" }
