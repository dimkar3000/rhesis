[package]
name = "rhesis"
version = "0.5.1"
authors = ["dimkar <dimkar3000@gmail.com>"]
edition = "2021"
license = "MIT"

[dependencies]
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
cxx = "1.0.176"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"] }
cxx-qt-lib-extras = { version = "0.9.1" }

env_logger = "0.11.11"
lazy_static = "1.5.0"
log = "0.4.33"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = { version = "1.0.228", features = ["serde_derive"] }
# The fake completion provider (RHESIS_FAKE_LT) parses recorded fixtures,
# so this is a runtime dependency, not just a dev one.
serde_json = "1.0"

tokio = { version = "1.52.3", features = ["full", "sync"] }

[[bin]]
name = "rhesis"
path = "src/main.rs"

[[bin]]
name = "rhesis-ui-runner"
path = "src/bin/rhesis-ui-runner.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
debug = true

[build-dependencies]
# The link_qt_object_files feature is required for statically linking Qt 6.
cxx-qt-build = { version = "0.9.0", features = ["link_qt_object_files"] }
glob = "0.3.3"

[dev-dependencies]

# Test targets are declared explicitly: the files live in tests/unit/ and
# tests/e2e/ rather than directly in tests/, so cargo cannot auto-discover
# them. A new test file needs its [[test]] entry or it never runs.

# --- E2E tiers (whole process, real Qt) -------------------------------------

# Boots the real Root.qml through the production sequence (C++ probes come
# from src/ui_tests/harness.cpp, compiled by build.rs).
[[test]]
name = "ui-boot"
path = "tests/e2e/ui_boot.rs"

# QML page suites (tests/ui/*.qml) via the Qt Quick Test runner binary.
[[test]]
name = "qml-suites"
path = "tests/e2e/qml_suites.rs"

# Two real binary launches: the single-instance guard.
[[test]]
name = "single-instance-e2e"
path = "tests/e2e/single_instance_e2e.rs"

# --- Unit tiers (public API, no Qt application) -----------------------------

# LanguageTool client: mock HTTP server, DTO -> Recommendation mapping.
[[test]]
name = "languagetool-client"
path = "tests/unit/languagetool_client.rs"

# LanguageTool worker: event loop, status transitions, debounce (mock server).
[[test]]
name = "languagetool-service"
path = "tests/unit/languagetool_service.rs"

# LanguageTool DTO: serde round-trip against a recorded response.
[[test]]
name = "languagetool-models"
path = "tests/unit/languagetool_models.rs"

# Recommendation -> QML conversion.
[[test]]
name = "recommendation"
path = "tests/unit/recommendation.rs"

# Async messaging helper: worker lifecycle, status mirroring, forwarding.
[[test]]
name = "async-messaging-helper"
path = "tests/unit/async_messaging_helper.rs"

# Single-instance guard: socket naming, show request payload.
[[test]]
name = "single-instance"
path = "tests/unit/single_instance.rs"
