[package]
name = "rhesis-languagetool"
description = "LanguageTool worker: server lifecycle, HTTP suggestion fetches, fixture provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
crossbeam.workspace = true
reqwest.workspace = true
serde.workspace = true
# The fake completion provider (the --fake-lt harness seam) parses recorded
# fixtures, so this is a runtime dependency, not just a dev one.
serde_json.workspace = true
# The worker drives its HTTP client on an internal runtime.
tokio.workspace = true
rhesis-platform = { path = "../rhesis-platform" }
# Shared wire/payload types (Recommendation) live upstream; the embedded
# server's factory port default comes from the constants crate.
rhesis-protocol = { path = "../rhesis-protocol" }
rhesis-constants = { path = "../rhesis-constants" }

# Test targets are declared explicitly: the files live in tests/unit/ (the
# fixture directory tests/fixtures/ holds no Rust), so cargo cannot
# auto-discover them. A new test file needs its [[test]] entry or it never runs.

# LanguageTool client: mock HTTP server, DTO -> Recommendation mapping.
[[test]]
name = "languagetool-client"
path = "tests/unit/languagetool_client.rs"

# LanguageTool worker: event loop, status transitions, debounce (mock server).
[[test]]
name = "languagetool-service"
path = "tests/unit/languagetool_service.rs"

# LanguageTool DTOs: serde round-trip against a recorded response.
[[test]]
name = "languagetool-dto"
path = "tests/unit/languagetool_dto.rs"
