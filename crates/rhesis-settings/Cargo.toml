[package]
name = "rhesis-settings"
description = "Versioned JSON settings store for the Rhesis daemon: defaults, atomic writes, INI migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The factory port default and its migration fallback are contract values.
rhesis-constants = { path = "../rhesis-constants" }
rhesis-platform = { path = "../rhesis-platform" }

# Test targets are declared explicitly: the files live in tests/unit/ (the
# fixture directory tests/fixtures/ holds no Rust), so cargo cannot
# auto-discover them. A new test file needs its [[test]] entry or it never runs.
[[test]]
name = "settings-store"
path = "tests/unit/settings_store.rs"
