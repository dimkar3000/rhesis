[package]
name = "rhesis-qt-client"
description = "The Qt client: CXX-Qt bridge, QML UI, connection loop and the QML test machinery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam.workspace = true
cxx = "1.0.176"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["qt_full"] }
cxx-qt-lib-extras = { version = "0.9.1" }

env_logger = "0.11.11"
lazy_static = "1.5.0"
log.workspace = true
serde.workspace = true
# Local-socket transport (Refactor.md §5): abstract UDS on Linux, named pipe
# on Windows, behind the schema's SERVICE_SOCKET_NAME.
interprocess = "2"

rhesis-constants = { path = "../rhesis-constants" }
rhesis-platform = { path = "../rhesis-platform" }
rhesis-protocol = { path = "../rhesis-protocol" }
rhesis-settings = { path = "../rhesis-settings" }

[build-dependencies]
# The link_qt_object_files feature is required for statically linking Qt 6.
cxx-qt-build = { version = "0.9.0", features = ["link_qt_object_files"] }
glob = "0.3.3"
