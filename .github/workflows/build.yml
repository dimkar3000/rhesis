name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Shared build step (also used by test.yml): builds the app + fastText +
  # language model + LanguageTool + trimmed JRE and caches the tree. The
  # packaging job below restores it instead of rebuilding.
  app:
    uses: ./.github/workflows/build-app.yml
    with:
      mode: release
      profile: auto

  package:
    needs: [app]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/rhesis-ci:kde-6.11
      options: --privileged
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      # Never mutate translation sources in clean-room builds: compile the
      # committed .ts files only (the container's lupdate lacks QML support
      # and would otherwise empty them). Local builds still run lupdate.
      SKIP_LUPDATE: 1
      # The profile the shared build used; packaging scripts must match it.
      RUST_BUILD_TYPE: ${{ needs.app.outputs.profile }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: generate-metainfo.py resolves historic
          # release dates from git tags (CHANGELOG.md holds the content).
          fetch-depth: 0

      - name: Allow git in container workspace
        # The KDE SDK container runs as a different UID than the checkout
        # owner, so git refuses to work ("dubious ownership") unless told
        # the workspace is safe. generate-metainfo.py degrades gracefully
        # without git, but real tag dates need it.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check version consistency (final releases only)
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: ./scripts/check-versions.sh

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          # Same paths, same order as the release save in build-app.yml:
          # actions/cache hashes the path list into the cache version, so a
          # reordering turns every restore into a miss.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/cmake-build
            build/artifacts
            build/fasttext-src
            build/LanguageTool-6.6.zip
            build/lid.176.ftz
          key: ${{ needs.app.outputs.cache-key }}

      - name: Build Flatpak
        run: ./scripts/build-flatpak.sh --verbose --no-spinner --no-runtimes

      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh \
            --linuxdeploy /opt/appimage-tools/linuxdeploy-x86_64.AppImage \
            --appimagetool /opt/appimage-tools/appimagetool-x86_64.AppImage \
            --verbose \
            --no-spinner

      - name: Build desktop tarball (global)
        run: ./scripts/build-desktop.sh --verbose --no-spinner

      - name: Build desktop tarball (local)
        run: ./scripts/build-desktop.sh --local --verbose --no-spinner

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: build/artifacts/flatpak/*.flatpak

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimages
          path: build/artifacts/appimage/*.AppImage

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: build/artifacts/desktop/*.tar.gz

  release:
    needs: [package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          cp artifacts/flatpak/*.flatpak release/
          cp artifacts/appimages/*.AppImage release/
          cp artifacts/desktop/*.tar.gz release/
          chmod +x scripts/runner.sh
          cp scripts/runner.sh release/runner.sh
          ls -lh release/

      - name: Generate release body from CHANGELOG
        run: python3 scripts/release-body.py CHANGELOG.md "${{ github.ref_name }}" > release_body.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_body.md
