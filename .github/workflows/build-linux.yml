name: Linux build

# The Linux build step the pipeline (`pipeline.yml`) calls, in two modes:
#
#   test    — the common job, run on every ref: `cargo test --workspace
#             --no-run` (every test target plus the app and the QML runner,
#             compiled once), `cargo clippy` so the lint pass's check-mode
#             artifacts are cached with the build, then — after the cache
#             save, in the same workspace — the test tier itself: fmt, the
#             daemon's headless ldd gate and the test run. A red test run
#             still banks its compile for the next one.
#   release — `scripts/build-common.sh`: the app (CMake + cargo), fastText,
#             the language model, LanguageTool and the trimmed JRE, exactly
#             what the packaging jobs consume.
#
# Both modes use the same cache layout, keyed by profile and Cargo.lock, so
# a consuming job restores the tree instead of rebuilding it. A caller
# restores with `actions/cache/restore` using the `cache-key` output.
on:
  workflow_call:
    inputs:
      mode:
        description: "test (prebuild debug test binaries) or release (packaged build)"
        required: false
        type: string
        default: test
      profile:
        description: "Cargo profile; auto = release"
        required: false
        type: string
        default: auto
    outputs:
      cache-key:
        description: "Key of the cache this build populated"
        value: ${{ jobs.build-linux.outputs.cache-key }}
      profile:
        description: "Effective Cargo profile (debug, release)"
        value: ${{ jobs.build-linux.outputs.profile }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/rhesis-ci:kde-6.11
    env:
      SKIP_LUPDATE: 1
      # Incremental artifacts are useless across runs and dwarf the cache.
      CARGO_INCREMENTAL: 0
      # CI test artifacts do not need line tables; the assertions carry the
      # diagnostics. Keeping debug info off cuts the cache by gigabytes.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    outputs:
      cache-key: ${{ steps.cache-key.outputs.save-key }}
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release builds regenerate metainfo dates from historic tags;
          # Cargo.lock hashing needs only the checkout itself.
          fetch-depth: 0

      - name: Allow git in container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check version consistency (final releases only)
        # Same gate as the windows build: the packaging path must never
        # start on a tag whose version does not match the sources.
        if: inputs.mode == 'release' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: ./scripts/check-versions.sh

      - name: Resolve profile
        id: profile
        run: |
          profile="${{ inputs.profile }}"
          if [ "${{ inputs.mode }}" = "test" ]; then
            profile=debug
          elif [ "$profile" = "auto" ]; then
            profile=release
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Cache key
        id: cache-key
        run: |
          # Cargo.lock pins the dependency graph, so the restore key is
          # stable across source commits: cargo rebuilds only the crates that
          # changed. The save key adds the run id, because the consuming job
          # must restore the tree THIS run produced — a stable save key would
          # pin the cache to the first commit with that lockfile and hand the
          # packaging job an app built from older sources.
          base="rhesis-${{ runner.os }}-${{ steps.profile.outputs.profile }}-${{ hashFiles('Cargo.lock') }}"
          echo "restore-key=$base" >> "$GITHUB_OUTPUT"
          echo "save-key=$base-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Cache paths
        id: cache-paths
        run: |
          # Only list what the mode produces: actions/cache warns about every
          # missing path, and a test build has no packaging tree.
          {
            echo "paths<<EOF"
            echo "~/.cargo/registry"
            echo "~/.cargo/git"
            if [ "${{ inputs.mode }}" = "release" ]; then
              # build-common builds through CMake, which passes
              # --target-dir build/cmake-build, so the release Cargo tree
              # lives there, not in build/target.
              echo "build/cmake-build"
              echo "build/artifacts"
              echo "build/fasttext-src"
              echo "build/LanguageTool-6.6.zip"
              echo "build/lid.176.ftz"
            else
              echo "build/target"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ steps.cache-key.outputs.restore-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.restore-key }}-
            rhesis-${{ runner.os }}-${{ steps.profile.outputs.profile }}-

      - name: Build test binaries
        if: inputs.mode == 'test'
        env:
          # `.cargo/config.toml` is gitignored, so a clean CI checkout has no
          # target-dir override: name it here to match the cached path.
          CARGO_TARGET_DIR: build/target
        # Workspace-wide: the member crates carry the LanguageTool and
        # platform test tiers; only the root package alone would skip them.
        run: cargo test --workspace --no-run

      # Clippy compiles in check mode, which produces metadata artifacts that
      # test code generation cannot reuse. Running it here (rather than in the
      # test job) puts those artifacts in the same cache as the binaries, so
      # later runs only re-check the workspace crate instead of every
      # dependency.
      - name: Workspace lint
        if: inputs.mode == 'test'
        env:
          CARGO_TARGET_DIR: build/target
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build release artifacts
        if: inputs.mode == 'release'
        env:
          RUST_BUILD_TYPE: ${{ steps.profile.outputs.profile }}
        run: ./scripts/build-common.sh --verbose --no-spinner

      # Always save: the consumer must get this run's tree, not the older
      # entry the restore step reused for speed.
      - name: Save build cache
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ steps.cache-key.outputs.save-key }}

      # The test tier runs after the cache save, in the same job: the
      # compiled tree is already in the workspace, so the run costs no
      # restore, and a red run still banks its compile for the next one.
      - name: Formatting
        if: inputs.mode == 'test'
        run: cargo fmt --workspace --check

      - name: Daemon binary links no Qt (headless check)
        if: inputs.mode == 'test'
        # The daemon bin lives in the Qt workspace (`src/rhesis-server.rs`,
        # root package) and stays Qt-free only while it never references the
        # `rhesis-qt-client` crate: any use — even a plain const — pulls the
        # bridge's #[link] registrations in, and libQt6* lands in NEEDED on
        # the CI linker (bfd defaults to --no-as-needed). The pull-in is
        # invisible on the rustc command line; this ldd gate is the only
        # thing that catches it. The client binary's QuickTest link gate
        # stays local (AGENTS.md).
        env:
          CARGO_TARGET_DIR: build/target
        run: |
          binary=build/target/debug/rhesis-service
          if ! [ -x "$binary" ]; then
            echo "ERROR: $binary not built; the shared build must produce it" >&2
            exit 1
          fi
          if ldd "$binary" | grep -iE 'qt[0-9]|quicktest'; then
            echo "ERROR: rhesis-service links Qt (see above); the daemon must stay headless" >&2
            exit 1
          fi

      - name: Tests
        if: inputs.mode == 'test'
        # `qml_suites_pass` is the only test in the QML page-suite target.
        # That tier renders screenshots for manual inspection, which is a
        # local-development tool; CI runs every assertion tier but does not
        # generate images. Run it locally with:
        #   cargo test --test qml-suites
        env:
          CARGO_TARGET_DIR: build/target
          QT_QPA_PLATFORM: offscreen
        run: cargo test --workspace -- --skip qml_suites_pass
